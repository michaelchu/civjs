name: Full integration suite

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  full-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: cd apps/server && npm ci

      - name: Run full PostgreSQL integration and recovery suite
        run: npm run test:integration

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-integration-diagnostics
          path: |
            apps/server/test-results
            apps/server/coverage
          if-no-files-found: ignore
