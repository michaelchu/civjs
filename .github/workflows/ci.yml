name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd apps/client && npm ci

      - name: Install server dependencies
        run: cd apps/server && npm ci
      - name: Run linting
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check test evidence declarations
        run: npm run check:test-evidence

      - name: Check Civ2Civ3 action-evidence metadata
        run: npm run check:civ2civ3-action-evidence

      - name: Check Civ2Civ3 nation reference conversion
        run: npm run check:civ2civ3-nations

      - name: Run type checking
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://civjs:civjs_secret@localhost:5432/civjs_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: civjs
          POSTGRES_PASSWORD: civjs_secret
          POSTGRES_DB: civjs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civjs -d civjs_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd apps/client && npm ci

      - name: Install server dependencies
        run: cd apps/server && npm ci

      - name: Run client unit tests
        run: cd apps/client && npm run test

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Run browser parity tests
        run: npm run test:e2e

      - name: Run server unit tests
        run: cd apps/server && npm run test:unit -- --ci --coverage --maxWorkers=2

      - name: Run PostgreSQL integration and recovery tests
        run: npm run test:integration

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            apps/client/coverage
            apps/server/coverage
            test-results/browser
            playwright-report

  civ2civ3-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore pinned Freeciv server oracle
        id: freeciv-oracle-cache
        uses: actions/cache@v4
        with:
          # The oracle runner validates both the binary and this exact pinned
          # source checkout. Keep the cache-key version in sync with a source
          # pin or Meson option change below.
          path: |
            ${{ runner.temp }}/freeciv-source
            ${{ runner.temp }}/freeciv-build
          key: freeciv-oracle-${{ runner.os }}-${{ runner.arch }}-v1-440b3c9650d3052792296868cb15591bd40612ea

      - name: Install Freeciv build dependencies
        if: steps.freeciv-oracle-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libbz2-dev \
            libcurl4-openssl-dev \
            libglib2.0-dev \
            libicu-dev \
            liblzma-dev \
            libsqlite3-dev \
            libzstd-dev \
            meson \
            ninja-build \
            pkg-config \
            zlib1g-dev

      - name: Fetch pinned upstream Freeciv source
        if: steps.freeciv-oracle-cache.outputs.cache-hit != 'true'
        run: |
          git init "$RUNNER_TEMP/freeciv-source"
          git -C "$RUNNER_TEMP/freeciv-source" remote add origin https://github.com/freeciv/freeciv.git
          git -C "$RUNNER_TEMP/freeciv-source" fetch --depth=1 origin 440b3c9650d3052792296868cb15591bd40612ea
          git -C "$RUNNER_TEMP/freeciv-source" checkout --detach FETCH_HEAD

      - name: Build pinned Freeciv server oracle
        if: steps.freeciv-oracle-cache.outputs.cache-hit != 'true'
        run: |
          meson setup "$RUNNER_TEMP/freeciv-build" "$RUNNER_TEMP/freeciv-source" \
            '-Dclients=[]' \
            '-Dfcmp=[]' \
            '-Dtools=[]' \
            -Daudio=none \
            -Dnls=false \
            -Dmwand=false \
            -Dreadline=false \
            -Dsyslua=false \
            -Dserver=enabled \
            -Ddefault_library=static
          ninja -C "$RUNNER_TEMP/freeciv-build"

      - name: Summarize Freeciv oracle cache use
        run: |
          if [ "${{ steps.freeciv-oracle-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Freeciv oracle cache hit: skipped the pinned-source fetch and native server compilation." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Freeciv oracle cache miss: this run populated the reusable pinned source and server build cache." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install server dependencies
        run: cd apps/server && npm ci

      - name: Generate batched Civ2Civ3 Freeciv oracle results
        env:
          FREECIV_ORACLE_BIN: ${{ runner.temp }}/freeciv-build/freeciv-server
          FREECIV_ORACLE_DATA: ${{ runner.temp }}/freeciv-source/data
          FREECIV_ORACLE_SOURCE: ${{ runner.temp }}/freeciv-source
          FREECIV_ORACLE_PORT: '0'
        # One runner invocation starts Freeciv once and evaluates every
        # deterministic fixture. Jest consumes this read-only result bundle.
        run: node tools/run-freeciv-oracle.mjs > "$RUNNER_TEMP/civ2civ3-oracle-results.json"

      - name: Verify batched Civ2Civ3 differential oracle results
        env:
          FREECIV_ORACLE_RESULTS: ${{ runner.temp }}/civ2civ3-oracle-results.json
        run: cd apps/server && npm run test:unit -- --runTestsByPath tests/game/Civ2Civ3Oracle.test.ts tests/game/UnitManager.test.ts
