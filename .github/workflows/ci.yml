name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd apps/client && npm ci

      - name: Install server dependencies
        run: cd apps/server && npm ci
      - name: Run linting
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run type checking
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://civjs:civjs_secret@localhost:5432/civjs_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: civjs
          POSTGRES_PASSWORD: civjs_secret
          POSTGRES_DB: civjs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civjs -d civjs_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd apps/client && npm ci

      - name: Install server dependencies
        run: cd apps/server && npm ci

      - name: Run client unit tests
        run: cd apps/client && npm run test

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Run browser parity tests
        run: npm run test:e2e

      - name: Run server unit tests
        run: cd apps/server && npm run test:unit -- --ci --coverage --maxWorkers=2

      - name: Run PostgreSQL integration and recovery tests
        run: npm run test:integration

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            apps/client/coverage
            apps/server/coverage
            test-results/browser
            playwright-report
