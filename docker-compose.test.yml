name: civjs-integration

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: civjs
      POSTGRES_PASSWORD: civjs_secret
      POSTGRES_DB: civjs_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U civjs -d civjs_test']
      interval: 2s
      timeout: 5s
      retries: 20
